<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Launch | Student Research Council</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at center, #eef6ff 0%, #ffffff 45%, #f4f8fc 100%);
        }

        .launch-container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo-circle {
            width: 130px;
            height: 130px;
            margin: 0 auto 35px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(255, 255, 255, 0.9);

            border: 2px solid #dbeafe;

            box-shadow:
                0 0 0 10px rgba(37, 99, 235, 0.04),
                0 15px 50px rgba(37, 99, 235, 0.15);

            animation: float 3s ease-in-out infinite;
        }

        .logo-circle span {
            font-size: 30px;
            font-weight: 800;
            color: #2563eb;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 42px;
            color: #172554;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .launch-btn {
            position: relative;

            padding: 16px 42px;

            border: none;
            border-radius: 50px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #3b82f6
            );

            color: white;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 12px 30px rgba(37, 99, 235, 0.25);

            transition: 0.3s ease;
        }

        .launch-btn:hover {
            transform: translateY(-3px) scale(1.03);

            box-shadow:
                0 18px 40px rgba(37, 99, 235, 0.35);
        }

        .launch-btn:active {
            transform: scale(0.96);
        }

        /* Animation rings */

        .ring {
            position: fixed;

            top: 50%;
            left: 50%;

            width: 100px;
            height: 100px;

            border: 2px solid #3b82f6;

            border-radius: 50%;

            transform: translate(-50%, -50%) scale(0);

            opacity: 0;

            pointer-events: none;
        }

        .launching .ring:nth-child(1) {
            animation: expand 2s ease-out forwards;
        }

        .launching .ring:nth-child(2) {
            animation: expand 2s 0.25s ease-out forwards;
        }

        .launching .ring:nth-child(3) {
            animation: expand 2s 0.5s ease-out forwards;
        }

        .launching .launch-container {
            animation: disappear 1.5s ease forwards;
        }

        .launching {
            animation: pageFade 2.2s ease forwards;
        }

        @keyframes expand {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0.8;
            }

            100% {
                transform: translate(-50%, -50%) scale(25);
                opacity: 0;
            }
        }

        @keyframes disappear {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(0.8);
            }
        }

        @keyframes pageFade {
            0% {
                background: #ffffff;
            }

            100% {
                background: #dbeafe;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 14px;
            }

            .logo-circle {
                width: 110px;
                height: 110px;
            }

            .launch-btn {
                padding: 14px 32px;
            }
        }
    </style>
</head>

<body>

    <!-- Animation Rings -->
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>

    <div class="launch-container">

        <div class="logo-circle">
            <span>SRC</span>
        </div>

        <h1>Student Research Council</h1>

        <p class="subtitle">
            Where Innovation Meets Reality
        </p>

        <button class="launch-btn" onclick="launchWebsite()">
            Launch Website
        </button>

    </div>


    <script>

        function launchWebsite() {

            // Prevent multiple clicks
            document.body.classList.add("launching");

            const button = document.querySelector(".launch-btn");

            button.innerHTML = "Launching...";

            button.disabled = true;

            /*
                Wait for the animation to finish,
                then open index.html
            */

            setTimeout(function () {

                window.location.href = "index.html";

            }, 2200);

        }

    </script>

</body>
</html>
